<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>원우ENG CWT 생산계획 수립 프로그램</title>
  <link rel="stylesheet" href="./styles.css">
  <script src="./xlsx.full.min.js?v=20260722_1710"></script>
</head>
<body>
  <main class="app-shell">
    <header class="app-header">
      <div>
        <h1>원우ENG CWT 생산계획 수립 프로그램</h1>
        <p>월확정 통합1/2라인과 물류번호별 자재소요현황을 생산번호 기준으로 매칭해 착수일 순 생산계획을 생성합니다.</p>
      </div>
      <div class="header-status">
        <span>기준 KEY</span>
        <strong>생산번호 = 물류번호</strong>
      </div>
    </header>

    <section class="upload-grid" aria-label="파일 업로드">
      <label class="upload-card" for="line1File">
        <span class="card-number">1</span>
        <strong>월확정조립서열계획 통합1라인</strong>
        <small>전체 사용 · KPA10~ 자재와 매칭</small>
        <input id="line1File" type="file" accept=".xlsx,.xls">
        <em id="line1Name">파일을 선택하세요</em>
      </label>

      <label class="upload-card" for="line2File">
        <span class="card-number">2</span>
        <strong>월확정조립서열계획 통합2라인</strong>
        <small>HX~/R~ 현대 제품만 사용 · DX~ 제외</small>
        <input id="line2File" type="file" accept=".xlsx,.xls">
        <em id="line2Name">파일을 선택하세요</em>
      </label>

      <label class="upload-card" for="materialFile">
        <span class="card-number">3</span>
        <strong>물류번호별 자재소요현황</strong>
        <small>KPA10~/KPA20~ 및 카운터웨이트 품명만 사용</small>
        <input id="materialFile" type="file" accept=".xlsx,.xls">
        <em id="materialName">파일을 선택하세요</em>
      </label>
    </section>

    <section class="action-band">
      <button id="buildBtn" type="button" disabled>생산계획 생성</button>
      <button id="resetBtn" type="button">초기화</button>
      <div class="period-box">
        <span>착수기간</span>
        <strong id="periodText">파일 업로드 후 자동 산정</strong>
      </div>
    </section>

    <section class="summary-grid" aria-label="검증 요약">
      <div class="summary-card">
        <span>통합1라인</span>
        <strong id="line1Count">-</strong>
        <small>KPA10~ 매칭 대상</small>
      </div>
      <div class="summary-card">
        <span>통합2라인</span>
        <strong id="line2Count">-</strong>
        <small>HX~/R~ 현대 제품</small>
      </div>
      <div class="summary-card">
        <span>정상 생산계획</span>
        <strong id="planCount">-</strong>
        <small>엑셀 생성 대상</small>
      </div>
      <div class="summary-card warn">
        <span>예외</span>
        <strong id="exceptionCount">-</strong>
        <small>예외목록 시트 기록</small>
      </div>
    </section>

    <section class="result-panel">
      <div class="panel-header">
        <h2>처리 결과</h2>
        <button id="downloadBtn" type="button" disabled>엑셀 다운로드</button>
      </div>
      <div id="messages" class="messages">3개 파일을 업로드하면 생산계획을 생성할 수 있습니다.</div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>착수일</th>
              <th>라인</th>
              <th>생산번호</th>
              <th>자재번호</th>
              <th>모델명</th>
              <th>차대호기</th>
              <th>CWT</th>
              <th>RADAR</th>
            </tr>
          </thead>
          <tbody id="previewBody">
            <tr><td colspan="8">미리보기 데이터가 없습니다.</td></tr>
          </tbody>
        </table>
      </div>
    </section>
  </main>

  <script src="./app.js?v=20260722_1710"></script>
</body>
</html>
